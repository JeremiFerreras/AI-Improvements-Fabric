name: Fabric 26.3 code package

on:
  push:
    branches:
      - "port/fabric-26.3-bootstrap"
  pull_request:
    branches:
      - "port/fabric-26.3-bootstrap"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check NeoForge/Fabric source mapping
        run: python tools/verify_port_parity.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, validate Class Tweaker and package (GameTests deferred)
        run: ./gradlew --no-daemon buildFabricPort

      - name: Inspect remapped JAR
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*-unstable.jar' ! -name '*sources*' | head -n 1)"
          test -n "$JAR"
          python tools/verify_port_parity.py --jar "$JAR"

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-improvements-fabric-26.3-package-reports
          path: |
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Fabric JARs
        uses: actions/upload-artifact@v4
        with:
          name: ai-improvements-fabric-26.3-package
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
