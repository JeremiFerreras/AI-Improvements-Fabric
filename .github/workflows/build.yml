name: Fabric 26.3 validation

on:
  push:
    branches:
      - "port/fabric-26.3-bootstrap"
  pull_request:
    branches:
      - "port/fabric-26.3-bootstrap"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Static source and structure audit
        run: python tools/verify_port_parity.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, validate Class Tweaker, execute GameTests and package
        run: ./gradlew --no-daemon validateAccessWidener build

      - name: Run distribution JAR in production Fabric dedicated server
        run: python tools/run_prod_server_smoke.py

      - name: Inspect packaged Fabric JAR
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*-unstable.jar' ! -name '*sources*' | head -n 1)"
          test -n "$JAR"
          python tools/verify_port_parity.py --jar "$JAR"

      - name: Upload failure reports and production server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-improvements-fabric-26.3-validation-reports
          path: |
            **/build/reports/
            **/build/test-results/
            build/production-server-smoke.log
            build/production-server-smoke/config/aiimprovements.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload validated JARs and smoke evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-improvements-fabric-26.3-validated
          path: |
            build/libs/*.jar
            build/production-server-smoke.log
            build/production-server-smoke/config/aiimprovements.json
          if-no-files-found: error
          retention-days: 14
