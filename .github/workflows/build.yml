name: Fabric 26.3 experimental build

on:
  push:
    branches:
      - "port/fabric-26.3-bootstrap"
  pull_request:
    branches:
      - "26.3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Class Tweaker and build
        run: ./gradlew --no-daemon validateAccessWidener build

      - name: Upload experimental JARs
        uses: actions/upload-artifact@v4
        with:
          name: ai-improvements-fabric-26.3-unstable
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
