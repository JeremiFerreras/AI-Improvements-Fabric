plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.group
version = project.version

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom supplies the repositories needed for Minecraft and Fabric.
}

loom {
    accessWidenerPath = file("src/main/resources/aiimprovements.classtweaker")
    mods {
        "aiimprovements" {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "aiimprovements-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def modVersionString = project.version.toString()
def archiveNameString = project.base.archivesName.get()

tasks.named("processResources", ProcessResources).configure {
    inputs.property("version", modVersionString)
    filesMatching("fabric.mod.json") {
        expand "version": modVersionString
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title": "AI-Improvements",
            "Specification-Vendor": "Built Broken Modding",
            "Specification-Version": modVersionString,
            "Implementation-Title": "AI-Improvements Fabric",
            "Implementation-Version": modVersionString,
            "Implementation-Vendor": "JeremiFerreras"
        ])
    }
    from("LICENSE") {
        rename { fileName -> "${fileName}_${archiveNameString}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}


// Normal development build: compile and package without running GameTests.
tasks.register("buildFabricPort") {
    group = "build"
    description = "Compiles and packages the Fabric port without executing GameTests."
    dependsOn("validateAccessWidener", "remapJar")
}
