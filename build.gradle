plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.group
version = project.version

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom supplies the repositories needed for Minecraft and Fabric.
}

loom {
    mods {
        "aiimprovements" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def modVersion = project.version.toString()

tasks.named("processResources", ProcessResources).configure {
    inputs.property("version", modVersion)

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title": "AI-Improvements",
            "Specification-Vendor": "Built Broken Modding",
            "Specification-Version": project.version,
            "Implementation-Title": "AI-Improvements Fabric",
            "Implementation-Version": project.version,
            "Implementation-Vendor": "JeremiFerreras"
        ])
    }

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
